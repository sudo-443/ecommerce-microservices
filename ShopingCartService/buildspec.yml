version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 825765396880.dkr.ecr.ap-south-1.amazonaws.com
      - REPOSITORY_URI=825765396880.dkr.ecr.ap-south-1.amazonaws.com/shopingCart-service
      - IMAGE_TAG=latest
  build:
    commands:
      - echo Building the Docker image...
      - docker build -f ShopingCart/Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG ShopingCart/
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
artifacts:
  files: '**/*'
